# Hub tests, contract validation, app unit tests and Android build on every push and pull request.
# Actions are pinned to release commits (supply-chain policy, as in the AppLabs starter). The Android SDK
# comes with the runner image.
name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: hub } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew test --no-daemon
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 -m venv .venv && .venv/bin/pip install -q openapi-spec-validator==0.7.1 && .venv/bin/python scripts/validate.py
  legal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 legal/build_pages.py --check
  app-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :androidApp:assembleDebug :shared:data:testAndroidHostTest :shared:ui:testAndroidHostTest --no-daemon
  push-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: { run: { working-directory: push-relay } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: node --test test/*.test.js
